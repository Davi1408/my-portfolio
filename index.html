<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>DesignByTheDave | Portfolio Moved</title>

  <link rel="canonical" href="https://davidoyayeye.github.io/">

  <meta http-equiv="refresh" content="0; url=https://davidoyayeye.github.io/">

  <script>
    const newPortfolio = "https://davidoyayeye.github.io/";
    const destination = new URL(newPortfolio);

    destination.search = window.location.search;
    destination.hash = window.location.hash;

    window.location.replace(destination.toString());
  </script>
</head>
<body>
  <p>My portfolio has moved.</p>
  <p>
    <a href="https://davidoyayeye.github.io/">
      Visit my new portfolio
    </a>
  </p>
</body>
</html>
